<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Device Metrics</title><link rel="stylesheet" href="style.css?v=0.1.3"></head>
<body><header><a href="/meshpulse/">← MeshPulse</a><h1>Device Metrics</h1><span id="connection" role="status">Connecting…</span></header>
<main><section class="controls" aria-label="Telemetry options"><label>Node <select id="node"><option value="">Loading nodes…</option></select></label><label>Time range <select id="range"><option value="3600">1 hour</option><option value="86400" selected>24 hours</option><option value="604800">1 week</option><option value="1209600">2 weeks</option><option value="2592000">30 days</option><option value="31536000">1 year</option></select></label><label>Expected interval <select id="interval"><option value="3600">1 hour</option><option value="10800">3 hours</option><option value="21600" selected>6 hours</option><option value="43200">12 hours</option><option value="86400">24 hours</option></select></label></section>
<label class="filter"><input type="checkbox" id="telemetry-only"> Only show nodes with recorded telemetry</label>
<p class="hint">Dotted lines span more than two expected reporting intervals; they connect received samples and do not represent measurements during the gap.</p><p id="status" role="status">Waiting for connection…</p><section id="latest" class="latest" aria-label="Latest readings"></section><section id="charts" class="charts" aria-label="Telemetry charts"></section><section><h2>Received samples</h2><div id="samples"></div></section></main><script src="app.js?v=0.1.3"></script></body></html>
